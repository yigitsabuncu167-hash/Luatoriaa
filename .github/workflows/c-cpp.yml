name: Build Luatoria

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Kopyala (Checkout)
      uses: actions/checkout@v4

    - name: Lua / Luatoria Projesini Derle
      run: |
        # Standart Lua Makefile yapısını kullanarak Linux için derleme yapıyoruz
        make linux

    - name: Derlenen Binary Dosyasını Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: luatoria-binary
        path: src/lua
