name: Luatoria Engine Executer

on:
  workflow_dispatch:

jobs:
  run-luatoria:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare and Compile
        run: |
          echo "=== Luatoria Derleniyor ==="
          gcc -O2 *.c -o luatoria -lm || gcc -O2 src/*.c -o luatoria -lm
          chmod +x luatoria

      - name: Test and Execute Binary
        run: |
          echo "=== Luatoria Çalıştırılıyor ==="
          ./luatoria -v
          if [ -f "test.lua" ]; then
            ./luatoria test.lua
          else
            echo "print('Luatoria Çalıştı!')" > default_test.lua
            ./luatoria default_test.lua
          fi
