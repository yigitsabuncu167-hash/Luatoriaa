name: Build Luatoria

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Kopyala (Checkout)
      uses: actions/checkout@v4

    - name: Derleme Araçlarını ve Bağımlılıkları Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libreadline-dev

    - name: Luatoria Projesini Derle
      run: |
        # Linux / Ubuntu ortamı için en kararlı hedef posix'tir
        make posix

    - name: Derlenen Binary Dosyasını Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: luatoria-binary
        path: src/lua
